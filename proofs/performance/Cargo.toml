[package]
name = "luabuddy-performance-proof"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[[bin]]
name = "luabuddy-performance"
path = "src/main.rs"

[dependencies]
jni = "=0.21.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
