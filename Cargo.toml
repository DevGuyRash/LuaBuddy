[workspace]
members = ["crates/luabuddy-core", "crates/luabuddy-patcher", "crates/luabuddy-host", "crates/luabuddy-cli", "xtask"]
resolver = "3"

[workspace.package]
version = "0.1.0-rc.2"
edition = "2024"
rust-version = "1.99"
license = "MIT"

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
jni = { version = "=0.21.1" }

[profile.release]
lto = "thin"
strip = "debuginfo"
